# The URL the site will be built for
base_url = "https://madin.dev"

title = "Madin"
description = "Madin blog: Software and other things I don't understand"

default_language = "en"

author = "Ibrahim Najjar"

compile_sass = false

# Nothing on the site queries a search index, so building one only adds bytes
build_search_index = false

minify_html = true

# Ignore blog license
ignored_content = ["*/README.md", "*/LICENSE-CC-BY-NC"]

# Only served via resize_image, never as the original
ignored_static = ["ibrahim_najjar.jpg", "about.txt", "books/*.jpg"]

generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]
external_links_target_blank = true
external_links_no_referrer = true
render_emoji = true
smart_punctuation = true
lazy_async_image = true

[markdown.highlighting]
theme = "monokai"
# Classes instead of inline styles shrink code-heavy pages several-fold
style = "class"
extra_grammars = ["syntaxes/ntlc.json"]

[extra]
subtitle = "Ibrahim Najjar's blog"
