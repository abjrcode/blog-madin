[[groups.topics]]
name = "Databases & Distributed Systems"
intro = ""

[[groups.topics.books]]
title = "Designing Data-Intensive Applications"
cover = "books/ddia.jpg"
author = "Martin Kleppmann"
url = "https://www.amazon.com/Designing-Data-Intensive-Applications-Reliable-Maintainable/dp/1449373321"
note = "While the title suggests that you might be reading about large scale data intensive systems, this is not really the case. It is more about how databases and distributed systems work and it serves both as an excellent explanation as well as a reference. I recommend this if you have been building enterprise applications and have a few years of experience under your belt. Excellent book."

