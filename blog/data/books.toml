cover = "books/grokking-dl.jpg"
author = "Andrew W. Trask"
url = "https://www.manning.com/books/grokking-deep-learning"
note = "An amazing book if you want to start your journey in the world of AI, machine learning and neural networks. Uses Python to build everything from scratch."

