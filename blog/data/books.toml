[[groups.topics.books]]
title = "Visual Group Theory"
cover = "books/visual-group.svg"
generated = true
author = "Nathan Carter"
url = "https://www.amazon.com/Visual-Group-Theory-Problem-Book/dp/088385757X"
note = "I discovered Group theory when I was studying Linear Algebra. It turned out to be the workhorse of modern mathematics and this is by far the best introduction you can have."

[[groups.topics]]
name = "Linear Algebra"
intro = "Linear Algebra is used everywhere. No matter what engineering or scientific discipline you plan to go through, Linear Algebra will be there, guaranteed."

[[groups.topics.books]]
title = "Linear Algebra, 4th Edition"
cover = "books/hefferon.jpg"
author = "Jim Hefferon"
url = "https://hefferon.net/linearalgebra/"
note = "This is a great introduction to Linear Algebra. It is free and it is written in a very intuitive way. It is a great book if you want to understand the concepts of Linear Algebra and not just memorize formulas. Professor Hefferon has a full accompanying video course, <a target=\"_blank\" href=\"https://www.youtube.com/watch?v=JnTa9XtvmfI\">free on YouTube</a>, that you can follow along while reading through the book. He has also provided answers for every single exercise in the book. Hands down the best course I have taken on the subject."

