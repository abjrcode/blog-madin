cover = "books/think-stats.jpg"
author = "Allen B. Downey"
url = "https://greenteapress.com/wp/think-stats-2e/"
note = "Allen introduces a lot mathematical concepts using a computational approach with hands-on Python code, and, all of his books are free. This is a great and practical book."

