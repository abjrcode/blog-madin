{% extends "base.html" %}
{% block title %}Page not found | {{ config.title }}{% endblock title %}
{% block main %}
<div class="mx-auto flex max-w-[42.5rem] flex-col items-center py-24 text-center md:py-32">
  <p class="eyebrow">404</p>
  <h1 class="mt-3 font-sans text-4xl md:text-5xl font-semibold tracking-tight">Page not found</h1>
  <p class="mt-5 text-xl text-muted">Sorry, this address doesn’t lead anywhere.</p>
  <div class="prose mt-10 text-lg">
    <p><a href="{{ config.base_url | safe }}">Back to the latest writing</a></p>
    <p class="text-base text-muted">If a link on this site brought you here, please <a href="https://github.com/abjrcode/blog-madin/issues">report it</a>.</p>
  </div>
</div>
{% endblock main %}
