{% extends "base.html" %}
{% block main %}
{% if section.extra.type == "standalone" %}
<div class="post-layout mx-auto grid max-w-6xl gap-x-12 gap-y-8 py-12 md:py-16 lg:grid-cols-[14rem_minmax(0,52rem)] lg:justify-center">
  <aside class="flex flex-col gap-6 lg:sticky lg:top-8 lg:max-h-[calc(100dvh-4rem)] lg:self-start lg:overflow-y-auto" aria-label="Contents">
    {% if section.toc %}{{<post_toc toc={section.toc} />}}{% endif %}
  </aside>
  <article class="min-w-0">
    {{<post_header title={section.title} date={section.extra.date} updated={section.extra.updated or ""} minutes={section.reading_time} lead={section.description or ""} />}}
    <div id="md-content" class="prose mt-12">{{ section.content | safe }}</div>
    {% if not section.extra.comments_disabled and config.mode != "serve" %}{{<comments />}}{% endif %}
  </article>
</div>
{{<scroll_to_top />}}
{% else %}
<div class="mx-auto max-w-3xl py-12 md:py-20">
  {{<series_card series={section} />}}
</div>
{% endif %}
{% endblock main %}
